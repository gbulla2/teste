name: Independent Maxwell FEM benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install mature FEM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh getdp curl unzip jq >/dev/null
          mkdir -p results
          gmsh --version | tee results/gmsh_version.txt
          getdp --version | tee results/getdp_version.txt
          dpkg -L getdp | tee results/getdp_files.txt
          find /usr/share -maxdepth 5 -type f \( -iname '*full*wave*' -o -iname '*.pro' -o -iname '*.geo' \) 2>/dev/null | head -500 | tee results/getdp_example_candidates.txt

      - name: Fetch and smoke-test ERMES 20.0 Linux binary
        continue-on-error: true
        run: |
          curl -L --fail --retry 3 -o ERMES_20.0_c7.4 https://raw.githubusercontent.com/Ruben-Otin/ERMES-20.0/main/ERMES_20.0/ERMES.gid/execs/unix/ERMES_20.0_c7.4
          chmod +x ERMES_20.0_c7.4
          file ERMES_20.0_c7.4 | tee results/ermes_file.txt
          ldd ERMES_20.0_c7.4 | tee results/ermes_ldd.txt || true
          (timeout 20 ./ERMES_20.0_c7.4 2>&1 || true) | head -200 | tee results/ermes_smoke.log

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: independent-fem-diagnostics
          path: results/
