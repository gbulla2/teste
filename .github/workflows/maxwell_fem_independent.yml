name: Independent Maxwell FEM benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Gmsh and GetDP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh getdp python3 python3-numpy >/dev/null
          mkdir -p results
          gmsh --version | tee results/gmsh_version.txt
          getdp --version | tee results/getdp_version.txt

      - name: Mesh explicit two-terminal port
        run: |
          cd independent_fem
          gmsh patch_getdp_lumped.geo -3 -format msh2 -clscale 2.0 -setnumber Lpatch 0.022 -o patch_getdp_lumped.msh -v 2
          ls -lh patch_getdp_lumped.msh | tee ../results/mesh_size.txt
          awk '/\$Elements/{getline; print "elements",$1}' patch_getdp_lumped.msh | tee ../results/mesh_elements.txt

      - name: Coarse sweep 1.5-4.5 GHz, 50 MHz
        run: |
          cd independent_fem
          printf 'f_GHz,Ireal_A,Iimag_A,Rin,Xin,Zmag,S11_dB\n' > ../results/getdp_lumped_sweep.csv
          for fMHz in $(seq 1500 50 4500); do
            fHz=$((fMHz * 1000000))
            rm -f port_V.txt port_I.txt
            timeout 150 getdp patch_getdp_lumped.pro -msh patch_getdp_lumped.msh -solve Wav -pos Port -setnumber f ${fHz} -v 1 >/tmp/getdp_lumped_${fMHz}.log 2>&1
            test -s port_I.txt
            python3 parse_lumped_port.py ${fMHz} port_I.txt >> ../results/getdp_lumped_sweep.csv
            echo "done ${fMHz} MHz"
          done
          python3 analyze_lumped_sweep.py
          cat ../results/getdp_lumped_summary.txt

      - name: Refine best minimum, 10 MHz
        run: |
          cd independent_fem
          bestMHz=$(cat ../results/best_mhz.txt)
          start=$((bestMHz-150))
          stop=$((bestMHz+150))
          printf 'f_GHz,Ireal_A,Iimag_A,Rin,Xin,Zmag,S11_dB\n' > ../results/getdp_lumped_refined.csv
          for fMHz in $(seq ${start} 10 ${stop}); do
            fHz=$((fMHz * 1000000))
            rm -f port_V.txt port_I.txt
            timeout 150 getdp patch_getdp_lumped.pro -msh patch_getdp_lumped.msh -solve Wav -pos Port -setnumber f ${fHz} -v 1 >/tmp/getdp_ref_${fMHz}.log 2>&1
            test -s port_I.txt
            python3 parse_lumped_port.py ${fMHz} port_I.txt >> ../results/getdp_lumped_refined.csv
          done
          python3 analyze_lumped_refined.py
          cat ../results/getdp_lumped_refined_summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: getdp-explicit-lumped-port-sweep
          path: results/
