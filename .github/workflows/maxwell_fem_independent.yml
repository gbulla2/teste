name: Independent Maxwell FEM benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install mature FEM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh getdp curl unzip jq git >/dev/null
          mkdir -p results
          gmsh --version | tee results/gmsh_version.txt
          getdp --version | tee results/getdp_version.txt

      - name: Clone ERMES and run shipped Microwave_Filter example
        run: |
          git clone --depth 1 https://github.com/Ruben-Otin/ERMES-20.0.git ermesrepo
          cp ermesrepo/ERMES_20.0/ERMES.gid/execs/unix/ERMES_20.0_c7.4 ./ERMES_20.0_c7.4
          chmod +x ERMES_20.0_c7.4
          cd ermesrepo/Examples/Microwave_Filter.gid
          cp ../../../ERMES_20.0_c7.4 .
          ls -lah | tee ../../../results/microwave_filter_files_before.txt
          (timeout 180 ./ERMES_20.0_c7.4 Microwave_Filter 2>&1 || true) | tee ../../../results/ermes_microwave_filter.log
          ls -lah | tee ../../../results/microwave_filter_files_after.txt
          find . -maxdepth 1 -type f -newermt '2 minutes ago' -print | sort | tee ../../../results/microwave_filter_new_files.txt
          cp -a . ../../../results/Microwave_Filter_after

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ermes-microwave-filter-run
          path: results/
