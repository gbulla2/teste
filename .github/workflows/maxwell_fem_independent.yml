name: Independent Maxwell FEM benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Gmsh and GetDP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh getdp python3 >/dev/null
          mkdir -p results
          gmsh --version | tee results/gmsh_version.txt
          getdp --version | tee results/getdp_version.txt

      - name: Mesh conformal patch
        run: |
          cd independent_fem
          gmsh patch_getdp.geo -3 -format msh2 -clscale 2.0 -setnumber Lpatch 0.022 -o patch_getdp.msh 2>&1 | tee ../results/gmsh_patch.log
          ls -lh patch_getdp.msh | tee ../results/mesh_size.txt
          grep -A20 '\$PhysicalNames' patch_getdp.msh | head -30 | tee ../results/physical_names.txt
          awk '/\$Elements/{getline; print "elements",$1}' patch_getdp.msh | tee ../results/mesh_elements.txt

      - name: Solve 2.4 GHz with converged MUMPS direct solve
        run: |
          cd independent_fem
          timeout 300 getdp patch_getdp.pro -solve Wav -pos Port -setnumber f 2.4e9 -v 4 2>&1 | tee ../results/getdp_2p4.log
          test -s port_ez.txt
          cp port_ez.txt ../results/port_ez_2p4.txt
          head -8 port_ez.txt | tee ../results/port_ez_head.txt

      - uses: actions/upload-artifact@v4
        with:
          name: getdp-patch-direct-2p4
          path: results/
