name: Independent Maxwell FEM benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Gmsh and GetDP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh getdp python3 python3-numpy >/dev/null
          mkdir -p results
          gmsh --version | tee results/gmsh_version.txt
          getdp --version | tee results/getdp_version.txt

      - name: Mesh explicit two-terminal port
        run: |
          cd independent_fem
          gmsh patch_getdp_lumped.geo -3 -format msh2 -clscale 2.0 -setnumber Lpatch 0.022 -o patch_getdp_lumped.msh -v 3 2>&1 | tee ../results/gmsh_lumped.log
          grep -A20 '\$PhysicalNames' patch_getdp_lumped.msh | tee ../results/physical_names.txt
          awk '/\$Elements/{getline; print "elements",$1}' patch_getdp_lumped.msh | tee ../results/mesh_elements.txt

      - name: Solve explicit 1 V terminal port at 2.4 GHz
        run: |
          cd independent_fem
          rm -f port_V.txt port_I.txt
          timeout 300 getdp patch_getdp_lumped.pro -msh patch_getdp_lumped.msh -solve Wav -pos Port -setnumber f 2.4e9 -v 4 2>&1 | tee ../results/getdp_lumped_2p4.log
          test -s port_V.txt
          test -s port_I.txt
          cp port_V.txt port_I.txt ../results/
          echo '--- V ---'; cat port_V.txt
          echo '--- I ---'; cat port_I.txt

      - uses: actions/upload-artifact@v4
        with:
          name: getdp-explicit-lumped-port-smoke
          path: results/
