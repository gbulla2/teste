name: Independent Maxwell FEM benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Gmsh and GetDP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh getdp python3 python3-numpy >/dev/null
          mkdir -p results
          gmsh --version | tee results/gmsh_version.txt
          getdp --version | tee results/getdp_version.txt

      - name: Mesh conformal patch
        run: |
          cd independent_fem
          gmsh patch_getdp.geo -3 -format msh2 -clscale 2.0 -setnumber Lpatch 0.022 -o patch_getdp.msh -v 2
          ls -lh patch_getdp.msh | tee ../results/mesh_size.txt
          awk '/\$Elements/{getline; print "elements",$1}' patch_getdp.msh | tee ../results/mesh_elements.txt

      - name: Frequency sweep with converged direct solves
        run: |
          cd independent_fem
          printf 'f_GHz,Rin,Xin,S11_dB\n' > ../results/getdp_sweep.csv
          for fMHz in $(seq 1800 25 2700); do
            fHz=$((fMHz * 1000000))
            rm -f port_ez.txt
            timeout 180 getdp patch_getdp.pro -solve Wav -pos Port -setnumber f ${fHz} -v 2 >/tmp/getdp_${fMHz}.log 2>&1
            test -s port_ez.txt
            python3 parse_port.py ${fMHz} port_ez.txt >> ../results/getdp_sweep.csv
            echo "done ${fMHz} MHz"
          done
          cat ../results/getdp_sweep.csv

      - name: Analyze competing resonances
        run: |
          cd independent_fem
          python3 analyze_sweep.py
          cat ../results/getdp_summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: getdp-patch-sweep-1p8-2p7
          path: results/
