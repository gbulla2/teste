name: Independent Maxwell FEM benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Gmsh and GetDP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh getdp python3 >/dev/null
          mkdir -p results
          gmsh --version | tee results/gmsh_version.txt
          getdp --version | tee results/getdp_version.txt

      - name: Mesh conformal patch
        run: |
          cd independent_fem
          gmsh patch_getdp.geo -3 -format msh2 -clscale 1.5 -setnumber Lpatch 0.022 -o patch_getdp.msh 2>&1 | tee ../results/gmsh_patch.log
          ls -lh patch_getdp.msh | tee ../results/mesh_size.txt
          grep -A20 '\$PhysicalNames' patch_getdp.msh | head -30 | tee ../results/physical_names.txt
          awk '/\$Elements/{getline; print "elements",$1}' patch_getdp.msh | tee ../results/mesh_elements.txt

      - name: Solve one GetDP frequency and inspect port line
        run: |
          cd independent_fem
          timeout 300 getdp patch_getdp.pro -solve Wav -pos Port -setnumber f 2.4e9 -v 4 \
            -ksp_type gmres -pc_type ilu -ksp_rtol 1e-8 -ksp_max_it 1000 2>&1 | tee ../results/getdp_2p4.log
          test -s port_line.txt
          cp port_line.txt ../results/port_line_2p4.txt
          echo '--- port_line head ---'
          head -20 port_line.txt
          echo '--- port_line tail ---'
          tail -10 port_line.txt

      - uses: actions/upload-artifact@v4
        with:
          name: getdp-patch-smoke-fast
          path: results/
